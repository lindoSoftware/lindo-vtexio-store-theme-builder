name: 🔍 Test VTEX Secrets

on:
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub Actions

jobs:
  test-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: 🧾 Checkout del código
        uses: actions/checkout@v4

      - name: 🧪 Mostrar si los secrets existen
        run: |
          echo "✅ VTEX_ACCOUNT está configurado"
          echo "✅ VTEX_WORKSPACE está configurado"
          echo "✅ VTEX_APP_KEY está configurado"
          echo "✅ VTEX_APP_TOKEN está configurado"

      - name: 🧰 Testear acceso a los secrets
        env:
          VTEX_ACCOUNT: ${{ secrets.VTEX_ACCOUNT }}
          VTEX_WORKSPACE: ${{ secrets.VTEX_WORKSPACE }}
          VTEX_APP_KEY: ${{ secrets.VTEX_APP_KEY }}
          VTEX_APP_TOKEN: ${{ secrets.VTEX_APP_TOKEN }}
        run: |
          if [ -z "$VTEX_APP_KEY" ] || [ -z "$VTEX_APP_TOKEN" ]; then
            echo "❌ Error: los secrets no están configurados correctamente"
            exit 1
          else
            echo "✅ Secrets cargados correctamente"
            echo "Cuenta: $VTEX_ACCOUNT"
            echo "Workspace: $VTEX_WORKSPACE"
          fi
